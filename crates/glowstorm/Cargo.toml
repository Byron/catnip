[package]
name = "glowstorm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A neon twin-stick arena shooter that runs inside kitty, Ghostty, and Rustty"
readme = "../../README.md"
keywords = ["game", "terminal", "kitty", "ghostty", "shooter"]
categories = ["games", "command-line-utilities"]

[dependencies]
catnip = { package = "catnip-engine", version = "0.1.0", path = "../catnip" }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"

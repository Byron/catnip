[package]
name = "catnip-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A small game engine for the kitty terminal graphics protocol"
readme = "README.md"
keywords = ["kitty", "terminal", "graphics", "gamedev", "ghostty"]
categories = ["game-engines", "rendering", "command-line-interface"]

[lib]
# Published as catnip-engine (the name catnip is taken); used as `catnip`.
name = "catnip"

[dependencies]
base64 = "0.22"
crossterm = "0.28"
rodio = { version = "0.22", default-features = false, features = ["playback"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }
